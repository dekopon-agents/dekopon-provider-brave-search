[workspace]

[package]
name = "dekopon-brave-search-provider"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license = "MPL-2.0"
description = "Credential-free Brave Search WASM provider for Dekopon"
repository = "https://github.com/dekopon-agents/dekopon-provider-brave-search"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
dekopon-provider-http = "=0.22.0"
dekopon-provider-sdk = { version = "=0.22.0", features = ["clap"] }
serde_json = "=1.0.151"
wit-bindgen = { version = "=0.62.0", default-features = false, features = ["macros", "realloc"] }

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
panic = "abort"
strip = "symbols"

[dev-dependencies]
dekopon-provider-sdk-testkit = "=0.22.0"
tokio = { version = "=1.49.0", default-features = false, features = ["macros", "rt-multi-thread"] }
